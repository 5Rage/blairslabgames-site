<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Last Second Workshop - free web demo</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #050812; color: #f4e9d8; font-family: Georgia, serif; overflow: hidden; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      h1 { margin: 0 0 10px; font-size: 17px; letter-spacing: 3px; color: #f2d27a; }
      #frame { position: relative; height: min(800px, calc(100vh - 80px)); height: min(800px, calc(100dvh - 80px)); aspect-ratio: 450 / 800;
               border: 3px solid #7a5a2a; border-radius: 22px; overflow: hidden; background: #0b1020; box-shadow: 0 0 40px rgba(242, 210, 122, 0.18); }
      #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b1020; }
      #bar { width: 60%; height: 8px; border-radius: 4px; background: #070c16; margin-top: 14px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f2d27a; }
      p.note { margin: 10px 0 0; font-size: 12px; color: #9aa0b4; }
      body.mobile h1, body.mobile p.note { display: none; }
      body.mobile { display: block; }
      body.mobile #frame { position: fixed; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; }
    </style>
  </head>
  <body>
    <h1>THE LAST SECOND WORKSHOP</h1>
    <div id="frame">
      <canvas id="unity-canvas" width=450 height=800 tabindex="-1"></canvas>
      <div id="loading">Opening the workshop&hellip;<div id="bar"><div id="fill"></div></div></div>
    </div>
    <p class="note">A short free demo. The full game is free on Android.</p>
    <script src="Build/a27cdefb2580e3d183770fb85e661fb3.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) document.body.className = "mobile";
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/b5abf8d3a74ac93223ef26d94038b573.data.unityweb",
        frameworkUrl: "Build/d87d774dc201b888fd0323efdf123c37.framework.js.unityweb",
        codeUrl: "Build/950a9a57578124723e7e92a411325ef0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "LastSecondWorkshop",
        productName: "The Last Second Workshop",
        productVersion: "0.9.12",
        // The save lives under Application.persistentDataPath: write it through to IndexedDB so a reload keeps it.
        autoSyncPersistentDataPath: true,
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        document.querySelector("#loading").textContent = "Sorry, the demo could not start in this browser. " + message;
      });
    </script>
  </body>
</html>
