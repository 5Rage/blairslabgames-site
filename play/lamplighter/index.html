<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Lamplighter - free web demo</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0d14; color: #f4e9d8; font-family: Georgia, serif; overflow: hidden; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: 5px; color: #ffd98a; }
      #frame { position: relative; height: min(800px, calc(100vh - 80px)); height: min(800px, calc(100dvh - 80px)); aspect-ratio: 450 / 800;
               border: 3px solid #6b5a2a; border-radius: 22px; overflow: hidden; background: #10131c; box-shadow: 0 0 40px rgba(242, 181, 68, 0.18); }
      #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #10131c; }
      #bar { width: 60%; height: 8px; border-radius: 4px; background: #0b0d14; margin-top: 14px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f2b544; }
      p.note { margin: 10px 0 0; font-size: 12px; color: #b8a68c; }
      body.mobile h1, body.mobile p.note { display: none; }
      body.mobile { display: block; }
      body.mobile #frame { position: fixed; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; }
    </style>
  </head>
  <body>
    <h1>THE LAMPLIGHTER</h1>
    <div id="frame">
      <canvas id="unity-canvas" width=450 height=800 tabindex="-1"></canvas>
      <div id="loading">Lighting the lamps&hellip;<div id="bar"><div id="fill"></div></div></div>
    </div>
    <p class="note">A short free demo. The full game is in closed testing on Android: join us on Discord.</p>
    <script src="Build/d2317fdcc7842336f927fb96a10d6666.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) document.body.className = "mobile";
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/e1e1ae4cd0b53ad287189b7e4b2f6bd6.data.unityweb",
        frameworkUrl: "Build/dfc15a5ff859e552c4ff0e051fe33249.framework.js.unityweb",
        codeUrl: "Build/ccbb4226b4e0789a6a3d4523a91eb3f0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BlairsLab",
        productName: "The Lamplighter",
        productVersion: "0.2.3",
        // The save lives under Application.persistentDataPath: write it through to IndexedDB so a reload keeps it.
        autoSyncPersistentDataPath: true,
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        document.querySelector("#loading").textContent = "Sorry, the demo could not start in this browser. " + message;
      });
    </script>
  </body>
</html>
